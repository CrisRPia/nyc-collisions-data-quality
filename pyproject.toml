[project]
name = "dmbok2-data-quality"
version = "0.1.0"
description = "DMBOK2 data quality assessment and cleanup of NYC collision data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20,<1",
    "httpx>=0.28,<1",
    "ipykernel>=6,<8",
    "ipywidgets>=8,<9",
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "matplotlib-stubs>=0.3.11,<1",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "pandas-stubs>=2.2",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
